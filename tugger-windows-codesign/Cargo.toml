[package]
name = "tugger-windows-codesign"
version = "0.11.0"
authors = ["Gregory Szorc <gregory.szorc@gmail.com>"]
edition = "2021"
license = "MPL-2.0"
description = "Code signing on Windows platforms"
keywords = ["tugger", "windows", "codesign", "authenticode", "signtool"]
homepage = "https://github.com/indygreg/PyOxidizer"
repository = "https://github.com/indygreg/PyOxidizer.git"
readme = "README.md"

[dependencies]
anyhow = "1.0.104"
duct = "1.1.2"
log = "0.4.35"
p12 = "0.6.3"
rcgen = "0.14.10"
time = "0.3.55"
yasna = "0.5.2"

[target.'cfg(target_family = "windows")'.dependencies.tugger-windows]
version = "0.11.0"
path = "../tugger-windows"

[dev-dependencies]
tugger-common = { version = "0.11.0", path = "../tugger-common" }
der-parser = "10.0.0"
x509-parser = "0.18.1"
