[package]
name = "cargolike"
authors = ["Tamas Nepusz <ntamas@protonmail.ch>"]
version = "0.2.0"
edition = "2021"
license = "Python-2.0 OR MPL-2.0"
description = "Provides functions to produce output similar to Cargo"
homepage = "https://github.com/indygreg/PyOxidizer"
repository = "https://github.com/indygreg/PyOxidizer.git"

[dependencies]
annotate-snippets = { version = "0.12.17", optional = true }
anstream = "1.0.0"
anstyle = "1.0.14"
anyhow = "1.0.104"
hostname = { version = "0.4.2", optional = true }
libc = "0.2.191"
serde_json = { version = "1.0.154", optional = true }
supports-hyperlinks = "3.2.0"
supports-unicode = "3.0.0"
url = { version = "2.5.8", optional = true }
windows-sys = { version = "0.61.2", features = [
  "Win32_Storage",
  "Win32_Storage_FileSystem",
] }

[features]
json = ["dep:serde_json"]
snippets = ["dep:annotate-snippets"]
url = ["dep:hostname", "dep:url"]
