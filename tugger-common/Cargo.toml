[package]
name = "tugger-common"
version = "0.11.0"
authors = ["Gregory Szorc <gregory.szorc@gmail.com>"]
edition = "2021"
license = "MPL-2.0"
description = "Common functionality used by various tugger crates"
keywords = ["tugger"]
homepage = "https://github.com/indygreg/PyOxidizer"
repository = "https://github.com/indygreg/PyOxidizer.git"
readme = "README.md"

[dependencies]
anyhow = "1.0.104"
fs2 = "0.4.3"
glob = "0.3.4"
hex = "0.4.3"
log = "0.4.35"
once_cell = "1.21.4"
reqwest = { version = "0.13.5", default-features= false, features = ["blocking", "rustls"] }
sha2 = "0.11.1"
tempfile = "3.27.0"
url = "2.5.8"
zip = { version = "9.3.0", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3.27.0"
